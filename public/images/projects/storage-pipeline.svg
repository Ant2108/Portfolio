" font-style="italic" fill="#7a1f2b">03</text><path d="M320 334V358" fill="none" stroke="#1d1915" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125" y="367" width="400" height="64" fill="#1d1915" fill-opacity="0.08"/><rect x="120" y="362" width="400" height="64" fill="#7a1f2b" stroke="#1d1915" stroke-width="1.5"/><text x="140" y="392" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" fill="#f6f1e7" font-weight="600">@PreAuthorize</text><text x="140" y="414" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#f6f1e7">role check per method</text><text x="502" y="403" font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="end" font-style="italic" fill="#f6f1e7">04</text><path d="M320 428V452" fill="none" stroke="#1d1915" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125" y="461" width="400" height="64" fill="#1d1915" fill-opacity="0.08"/><rect x="120" y="456" width="400" height="64" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.5"/><text x="140" y="486" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" fill="#1d1915" font-weight="600">Controller</text><text x="140" y="508" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#5a5045">Users · FacilityAssignment</text><text x="502" y="497" font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="end" font-style="italic" fill="#7a1f2b">05</text><path d="M320 522V546" fill="none" stroke="#1d1915" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125" y="555" width="400" height="64" fill="#1d1915" fill-opacity="0.08"/><rect x="120" y="550" width="400" height="64" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.5"/><text x="140" y="580" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" fill="#1d1915" font-weight="600">Service</text><text x="140" y="602" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#5a5045">business rules</text><text x="502" y="591" font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="end" font-style="italic" fill="#7a1f2b">06</text><path d="M320 616V640" fill="none" stroke="#1d1915" stroke-width="1.5" marker-end="url(#arr)"/><rect x="125" y="649" width="400" height="64" fill="#1d1915" fill-opacity="0.08"/><rect x="120" y="644" width="400" height="64" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.5"/><text x="140" y="674" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" fill="#1d1915" font-weight="600">Repository</text><text x="140" y="696" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#5a5045">Spring Data JPA</text><text x="502" y="685" font-family="Georgia, 'Times New Roman', serif" font-size="16" text-anchor="end" font-style="italic" fill="#7a1f2b">07</text><path d="M320 710V734" fill="none" stroke="#1d1915" stroke-width="1.5" marker-end="url(#arr)"/><path d="M120 750v52a200 14 0 0 0 400 0v-52" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.6"/><ellipse cx="320" cy="750" rx="200" ry="14" fill="#e3d9c4" stroke="#1d1915" stroke-width="1.6"/><text x="320" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="22" text-anchor="middle" fill="#1d1915">SQL Server</text><path d="M600 80V830" stroke="#1d1915" stroke-opacity="0.3"/><text x="640" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#5a5045">TOKENS</text><text x="640" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1d1915">Access token (JWT, jjwt) sent as Authorization: Bearer …</text><text x="640" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1d1915">Refresh token stored in the database → POST /api/auth/refresh</text><text x="640" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#5a5045">Passwords hashed with BCrypt before they are stored</text><text x="640" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#5a5045">SIGN-IN ROUTES</text><rect x="640" y="280" width="236" height="32" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.2"/><text x="758" y="301.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#1d1915">POST /api/auth/login</text><text x="930" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#5a5045">email + password</text><rect x="640" y="326" width="225.5" height="32" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.2"/><text x="752.75" y="347.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#1d1915">/oauth2/** · Google</text><text x="930" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#5a5045">GoogleOAuth2SuccessHandler issues the JWT</text><text x="640" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#5a5045">ROLES</text><rect x="640" y="436" width="250" height="32" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.2"/><text x="765" y="457.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#1d1915">CUSTOMER</text><rect x="640" y="478" width="250" height="32" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.2"/><text x="765" y="499.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#1d1915">FACILITY_STAFF</text><rect x="640" y="520" width="250" height="32" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.2"/><text x="765" y="541.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#1d1915">FACILITY_MANAGER</text><rect x="640" y="562" width="250" height="32" fill="#f6f1e7" stroke="#1d1915" stroke-width="1.2"/><text x="765" y="583.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#1d1915">BUSINESS_MANAGER</text><rect x="640" y="604" width="250" height="32" fill="#7a1f2b" stroke="#7a1f2b" stroke-width="1.2"/><text x="765" y="625.5" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" text-anchor="middle" letter-spacing="1" fill="#f6f1e7">SYSTEM_ADMIN</text><text x="1060" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#5a5045">Admin routes and facility</text><text x="1060" y="544" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#5a5045">assignments are reserved</text><text x="1060" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic" fill="#5a5045">for SYSTEM_ADMIN.</text><text x="640" y="688" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="3" fill="#5a5045">ALSO</text><text x="640" y="722" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1d1915">Bean Validation (@Valid) on request bodies · central GlobalExceptionHandler</text><text x="640" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1d1915">OpenAPI / Swagger documentation · CORS configured for the frontend</text>
